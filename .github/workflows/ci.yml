name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the instrumentation job below be triggered by hand from the Actions tab.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit test and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # gradle-wrapper.jar is a binary checked into the repo, so a pull request could in principle
      # swap it for a tampered one that executes during the build. This compares it against the
      # checksums Gradle publishes and fails the job if it doesn't match.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The Gradle daemon's JVM is pinned to JetBrains Runtime 21 by
      # gradle/gradle-daemon-jvm.properties, which the Temurin JDK above does not satisfy. Gradle
      # auto-provisions a matching JVM into ~/.gradle/jdks on the first run; caching it keeps
      # subsequent runs from re-downloading ~200 MB.
      - name: Cache auto-provisioned daemon JVM
        uses: actions/cache@v4
        with:
          path: ~/.gradle/jdks
          key: gradle-daemon-jvm-${{ runner.os }}-${{ hashFiles('gradle/gradle-daemon-jvm.properties') }}

      - name: Assemble debug
        run: ./gradlew assembleDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore

  instrumentation:
    # The Compose/Kaspresso suite needs a running emulator, which is slow and comparatively flaky,
    # so it is not part of the PR gate - it only runs when triggered by hand from the Actions tab.
    # Add a `schedule:` trigger to the `on:` block above if you want it running nightly.
    name: Instrumentation tests (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache auto-provisioned daemon JVM
        uses: actions/cache@v4
        with:
          path: ~/.gradle/jdks
          key: gradle-daemon-jvm-${{ runner.os }}-${{ hashFiles('gradle/gradle-daemon-jvm.properties') }}

      # Hardware acceleration for the emulator.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # minSdk is 34, so the emulator image cannot go lower.
      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
